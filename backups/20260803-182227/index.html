<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VarlBlaskDonate — Подача заявки</title>
<link rel="icon" href="/static/favicon.jpg">
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script defer src="static/qrcode.min.js"></script>
<link rel="stylesheet" href="static/style.css?v=1785787001">
</head>
<body class="theme-donation">
<!-- Live Background Elements -->
<div class="bg-grid-overlay"></div>
<div class="bg-glow-point" id="bg-glow"></div>
<canvas id="grid-canvas"></canvas>

<div class="container">
<header class="hero-header">
<h1 class="hero-title" id="recipientName">
<span class="word-group word-varol">
<span class="char-span" style="--i:0">V</span><span class="char-span" style="--i:1">a</span><span class="char-span" style="--i:2">r</span><span class="char-span" style="--i:3">o</span><span class="char-span" style="--i:4">l</span>
</span>
<span class="word-space"> </span>
<span class="word-group word-blask">
<span class="char-span" style="--i:5">B</span><span class="char-span" style="--i:6">l</span><span class="char-span" style="--i:7">a</span><span class="char-span" style="--i:8">s</span><span class="char-span" style="--i:9">k</span>
</span>
</h1>
</header>

<main class="card" id="mainCard">
<div class="tabs stagger-item">
<div class="tab-pill" id="tabPill"></div>
<button class="tab-btn active" id="tabDonation" onclick="switchCategory('donation')" type="button">
<span class="material-symbols-rounded">volunteer_activism</span>
<span>Донат</span>
</button>
<button class="tab-btn" id="tabInvestment" onclick="switchCategory('investment')" type="button">
<span class="material-symbols-rounded">trending_up</span>
<span>Инвестор</span>
</button>
</div>

<form id="paymentForm" onsubmit="submitPayment(event)">
<div id="formWrapper">

<!-- Направление / Цель -->
<div class="form-group stagger-item" style="position: relative; z-index: 50;">
<label class="form-label" for="optionSelectValue">Направление / Цель обращения</label>
<div class="custom-dropdown" id="customDropdown">
<div class="dropdown-trigger" id="dropdownTrigger" onclick="toggleDropdown()">
<span id="dropdownSelectedText">Выберите вариант...</span>
<span class="material-symbols-rounded dropdown-arrow">expand_more</span>
</div>
<div class="dropdown-menu" id="dropdownMenu"></div>
</div>
<input id="optionSelectValue" type="hidden"/>
</div>

<!-- Страна карты (с умным автокомплитом) -->
<div class="form-group stagger-item" style="position: relative; z-index: 48;">
<label class="form-label" for="countryInput">Можете выбрать подсказку страны Вашего банка для определения курса и сервиса перевода</label>
<input class="form-control" id="countryInput" autocomplete="off" oninput="onCountryInput(event)" placeholder="Например: Польша, Литва, Германия..." type="text" />
<div class="country-suggestions-box" id="countrySuggestions" style="display:none;"></div>
</div>

<!-- Сумма и Валюта (авто-определение по стране) -->
<div class="form-row" style="position: relative; z-index: 47;">
<div class="form-group flex-1 stagger-item">
<label class="form-label" for="amountInput"><span id="amountLabelText">Сумма доната €</span> <span class="field-req-badge">*</span></label>
<div class="amount-input-wrap">
<input class="form-control" id="amountInput" min="5" placeholder="0.00" step="0.01" type="number" required/>
<span class="amount-currency-symbol" aria-hidden="true">€</span>
</div>
<div id="exchangeRateHint" style="font-size: 11.5px; opacity: 0.7; margin-top: 8px; font-weight: 500; letter-spacing: 0.3px; display: none;"></div>
</div>
<input type="hidden" id="currencySelect" value="EUR" />
</div>



<!-- Комментарий -->
<div class="form-group stagger-item" style="position: relative; z-index: 44;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
  <label class="form-label" id="commentLabelText" for="commentInput" style="margin-bottom: 0;">Комментарий <span class="field-req-note">(необязательно)</span></label>
  <span id="commentCounter" style="font-size: 11px; opacity: 0.5;">0 / 500</span>
</div>
<textarea class="form-control no-resize" id="commentInput" maxlength="500" placeholder="Укажите детали или пожелания..." oninput="document.getElementById('commentCounter').innerText = this.value.length + ' / 500'" style="margin-top: 8px;"></textarea>
</div>





<button class="btn-submit" id="submitBtn" type="submit">
<span class="material-symbols-rounded" style="vertical-align: middle; margin-right: 6px;">send</span>
<span id="submitBtnText">Отправить заявку</span>
</button>

<div id="progressBar" style="display:none; width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:15px; overflow:hidden;">
<div id="progressFill" style="height:100%; width:0%; background:var(--accent-glow); transition: width 2s linear;"></div>
</div>

</div>
</form>

<!-- Результат подачи заявки -->
<div class="tx-result-box" id="txResultBox" style="display: none;">
<div><span class="material-symbols-rounded" style="font-size: 56px; color: #10B981; margin-bottom: 12px;">task_alt</span></div>
<div style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; opacity: 0.8;">Номер вашей заявки</div>
<div class="tx-code-val" style="cursor:pointer; display: inline-block;" onclick="copyTextWithTooltip(event, 'resTxCode')">
<span id="resTxCode">VB-XXXX-XXX</span>
<span class="material-symbols-rounded" style="font-size: 20px; vertical-align: -5px; opacity: 0.8; margin-left: 8px;">content_copy</span>
</div>
<div style="font-size: 11.5px; opacity: 0.6; margin-top: 6px; letter-spacing: 0.5px;">Нажмите, чтобы скопировать код</div>
<div class="result-status-text" id="resultStatusText" style="margin-top: 16px;">Заявка успешно зафиксирована.</div>
<div id="requisitesTimer" style="display:none; font-size: 15px; font-weight: 600; color: #f43f5e; margin-top: 25px; padding: 10px; border-radius: 8px; background: rgba(244, 63, 94, 0.1);">Актуальность реквизитов: <span id="timerCountdown">20:00</span></div>
<div id="dynamicRequisites" style="display: none; margin-top: 15px; text-align: left;"></div>
</div>

</main>

<footer class="footer">
© 2026 Varol Blask Payment Gateway. Encrypted &amp; Secured P2P.
</footer>
</div>

<script defer src="static/script.js?v=1785790000"></script>
</body>
</html>
